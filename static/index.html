<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Ilaaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#050504;
    --brass:#f2b705;
    --brass-bright:#ffd23f;
    --parchment:#faf8f2;
    --parchment-dim:#8f8b7f;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background:var(--ink);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    cursor:pointer;
  }

  .stage{ display:flex; flex-direction:column; align-items:center; gap:22px; }

  .pulse-wrap{ width:220px; height:70px; }
  .pulse-wrap svg{ width:100%; height:100%; overflow:visible; }
  .pulse-path{
    fill:none;
    stroke:var(--brass-bright);
    stroke-width:2.5;
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:400;
    stroke-dashoffset:400;
    animation: draw 1.3s cubic-bezier(.65,0,.35,1) forwards;
    filter: drop-shadow(0 0 6px rgba(255,210,63,.5));
  }
  @keyframes draw{ to{ stroke-dashoffset:0; } }

  .brand{
    display:flex;
    font-family:'Fraunces',serif; font-weight:600;
    font-size:2.6rem; letter-spacing:.01em; color:var(--parchment);
  }
  .brand span{
    display:inline-block;
    opacity:0; transform:translateY(14px);
    animation: letterIn .55s cubic-bezier(.2,.8,.2,1) forwards;
  }
  .brand span.accent{ color:var(--brass-bright); }
  @keyframes letterIn{ to{ opacity:1; transform:translateY(0); } }

  .status{
    font-family:'IBM Plex Mono',monospace; font-size:.72rem;
    letter-spacing:.16em; text-transform:uppercase;
    color:var(--parchment-dim);
    opacity:0;
    animation: fadeIn .6s ease forwards 1.9s;
  }
  @keyframes fadeIn{ to{ opacity:1; } }

  .veil{
    position:fixed; inset:0; background:var(--ink);
    opacity:0; pointer-events:none;
    transition:opacity .5s ease;
  }
  .veil.show{ opacity:1; }

  @media (prefers-reduced-motion:reduce){
    .pulse-path, .brand span, .status{ animation:none !important; opacity:1 !important; stroke-dashoffset:0 !important; transform:none !important; }
  }
</style>
</head>
<body onclick="enter()">

  <div class="stage">
    <div class="pulse-wrap">
      <svg viewBox="0 0 220 70">
        <path class="pulse-path" d="M0,35 L45,35 L58,10 L72,60 L86,35 L100,35 L110,20 L120,50 L130,35 L220,35" />
      </svg>
    </div>
    <div class="brand" id="brandText"></div>
    <div class="status">Preparing your consultation</div>
  </div>

  <div class="veil" id="veil"></div>

<script>
  const text = "E-Ilaaj";
  const el = document.getElementById('brandText');
  const startDelay = 1.15;
  [...text].forEach((ch, i) => {
    const span = document.createElement('span');
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    if (ch === 'E' || ch === '-') span.classList.add('accent');
    span.style.animationDelay = (startDelay + i * 0.06) + 's';
    el.appendChild(span);
  });

  let entered = false;
  function enter(){
    if(entered) return;
    entered = true;
    document.getElementById('veil').classList.add('show');
    setTimeout(() => { window.location.href = 'auth.html'; }, 480);
  }
  setTimeout(enter, 2800);
</script>
</body>
</html>
