<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Ilaaj — Sign In</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="auth-page">

  <div class="auth-container" id="auth-container">

    <div class="auth-header">
      <a href="index.html" class="auth-logo">E-Ilaaj</a>
      <div class="auth-subtitle">Homeopathic Consultation</div>
    </div>

    <div class="auth-tabs">
      <button type="button" class="tab-btn active" id="tab-login">Sign In</button>
      <button type="button" class="tab-btn" id="tab-signup">Register</button>
    </div>

    <!-- Login Form -->
    <form class="auth-form active" id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="name@example.com" required autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>

      <button type="submit" class="auth-submit-btn">Continue</button>
      <p class="auth-footer" id="login-error" style="color:#ff5555;"></p>
    </form>

    <!-- Signup Form -->
    <form class="auth-form" id="signup-form">
      <div class="form-group">
        <label for="signup-name">Full Name</label>
        <input type="text" id="signup-name" placeholder="John Doe" required autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="signup-email">Email Address</label>
        <input type="email" id="signup-email" placeholder="name@example.com" required autocomplete="off" />
      </div>

      <div class="form-group">
        <label for="signup-password">New Password</label>
        <input type="password" id="signup-password" placeholder="••••••••" required minlength="6" />
      </div>

      <button type="submit" class="auth-submit-btn">Create Account</button>
      <p class="auth-footer" id="signup-error" style="color:#ff5555;"></p>
    </form>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
